# Redis state store whose redisPassword is pulled from a Kubernetes secret.
# See https://docs.dapr.io/operations/components/component-secrets/
#
# This points at a DEDICATED, password-protected Redis (manifests/redis.yaml),
# NOT the shared no-auth redis-master. Because that Redis enforces `requirepass`,
# the client password actually matters: when redis-secret holds the correct
# password the store works; flip it to a wrong value, watch the component
# hot-reload, and the new connection sends AUTH with the wrong password — Redis
# rejects it, so state calls flip from OK to error.
#
# auth.secretStore defaults to the built-in "kubernetes" store in Kubernetes;
# set explicitly here for clarity.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secret-statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: secret-redis.default.svc.cluster.local:6379
  - name: redisPassword
    secretKeyRef:
      name: redis-secret
      key: redis-password
auth:
  secretStore: kubernetes
