# The Kubernetes Secret referenced by the state store's redisPassword.
# Starts with the CORRECT password for the dedicated, password-protected Redis
# (manifests/redis.yaml), so calls succeed. Patch it to a wrong value (e.g. via
# the Tilt buttons) to observe the component hot-reload and the new value take
# effect: the new connection sends AUTH with the wrong password, Redis rejects
# it, and state calls start failing.
#
# NOTE: this must match the `--requirepass` value in manifests/redis.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: default
type: Opaque
stringData:
  redis-password: "correct-password"
---
# RBAC so the Dapr sidecar (running as the pod's `default` service account) can
# read/list/watch Secrets in the default namespace. In operator (Kubernetes)
# mode the operator resolves the secret server-side, so this is belt-and-braces;
# it is what daprd uses if it ever resolves via its own kubernetes secret store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-py-secret-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-py-secret-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: Role
  name: secrets-py-secret-reader
  apiGroup: rbac.authorization.k8s.io
